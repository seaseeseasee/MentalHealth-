name: mindease

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      NODE_ENV: production
      DB_PATH: /data/mindease.db
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Comma-separated e-mails promoted to admin on start/registration (never demotes)
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    volumes:
      - mindease-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      # Bound to localhost by default; set MINDEASE_BIND=0.0.0.0 to expose on the LAN.
      - "${MINDEASE_BIND:-127.0.0.1}:${MINDEASE_PORT:-8480}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mindease-data:
